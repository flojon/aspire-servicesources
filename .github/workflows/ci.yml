name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A PR that gets a second push doesn't need the first run's result any more.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Everything runs in one job so the solution is restored and compiled once; the display
    # name spells out what that single check actually covers.
    name: 🔨 build, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the package version from tags/history, so the pack step
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Package versions live in Directory.Packages.props under central package
          # management, so hashing only the project files would keep serving a stale cache
          # across a version change.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # The build is warning-clean today; -warnaserror keeps it that way instead of letting
      # warnings accumulate unnoticed in PRs.
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # LogFilePrefix rather than LogFileName: every project multi-targets net8/9/10, and a
      # fixed file name makes each target framework overwrite the previous one's results.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory ./artifacts/test-results

      # Packing on every PR catches packaging-only breakage (missing README/LICENSE, bad
      # metadata) here rather than at release time, where release.yml deliberately has no
      # --skip-duplicate safety net. Packed project by project like preview.yml/release.yml:
      # the solution also holds the sample AppHost and the test projects.
      - name: Pack
        run: |
          dotnet pack src/Aspire.Hosting.ServiceSources/Aspire.Hosting.ServiceSources.csproj -c Release --no-build -o ./artifacts/package
          dotnet pack src/Aspire.Hosting.ServiceSources.Java/Aspire.Hosting.ServiceSources.Java.csproj -c Release --no-build -o ./artifacts/package
          dotnet pack src/Aspire.Hosting.ServiceSources.JavaScript/Aspire.Hosting.ServiceSources.JavaScript.csproj -c Release --no-build -o ./artifacts/package

      # Everything above packs whatever MinVer computes for the commit, which off a tag is
      # always a prerelease - so until a release tag existed, no pack in CI had ever produced
      # the shape that actually gets pushed to nuget.org, and the two differ in a way that
      # matters: PinCoreDependency closes a prerelease build's range with a -0 upper bound,
      # which nuget.org's gallery rejects at push time as an invalid version. v0.3.0 tagged,
      # built, packed and passed every check here, then failed the push for both satellites.
      #
      # So pack the release shape too. The version is synthetic and never published; it only
      # has to be stable, and to have a minor that differs from the patch so a bound built
      # from the wrong component cannot coincidentally match.
      #
      # PackageReleaseNotes is set explicitly for two reasons, and the second is load-bearing.
      # It keeps the changelog target from warning that 9.9.9 has no section - that target
      # fills the property only when it is empty. And it keeps the changelog *out* of this
      # nuspec: the 0.3.0 entry documents this very bound in an XML example, and only < and >
      # are escaped when it is embedded, so the literal text version="[0.3.0, 0.4.0-0)" would
      # survive into the manifest and trip the prerelease scan below on prose.
      - name: Pack the release shape
        run: |
          for proj in Aspire.Hosting.ServiceSources Aspire.Hosting.ServiceSources.Java Aspire.Hosting.ServiceSources.JavaScript; do
            dotnet pack "src/$proj/$proj.csproj" -c Release -o ./artifacts/stable \
              -p:MinVerVersionOverride=9.9.9 \
              -p:PackageReleaseNotes="release-shape check"
          done

      # PinCoreDependency in Directory.Build.targets rewrites the satellites' core dependency
      # into a version range, hooking _GetProjectReferenceVersions - a NuGet-internal target.
      # If a future SDK renames or reorders that target the rewrite silently stops happening
      # and the satellites go back to shipping a floor, with nothing else failing. Assert the
      # range reached the packed nuspec instead of trusting the build to notice.
      #
      # The grep matches an unescaped "<dependency": PackageReleaseNotes embeds the changelog,
      # whose XML example contains the same text with &lt; escapes, and would satisfy a looser
      # pattern on its own even if the real dependency element had lost its range.
      #
      # Every packed package except core is checked, rather than a name pattern covering the
      # satellites that exist today: the failure this guards against is silent, so a satellite
      # added later must not be able to slip past by being named something else.
      #
      # Checked over both packed shapes, the prerelease one and the release one, because the
      # upper bound deliberately differs between them and only one of the two is what gets
      # pushed to nuget.org. A single shape passing says nothing about the other.
      - name: Verify satellites constrain core
        run: |
          for dir in ./artifacts/package ./artifacts/stable; do
            core=$(ls "$dir"/KoalaSoft.Aspire.Hosting.ServiceSources.[0-9]*.nupkg)
            version=$(basename "$core" .nupkg)
            version=${version#KoalaSoft.Aspire.Hosting.ServiceSources.}
            # The bound PinCoreDependency computes: next minor, suffixed with -0 on a
            # prerelease build so the range excludes that minor's prereleases too, and left
            # bare on a stable one because nuget.org refuses to accept a prerelease bound.
            # Asserted in full - matching only the floor would pass a range whose upper bound
            # had drifted anywhere at all.
            rest=${version#*.}
            case "$version" in
              *-*) suffix="-0" ;;
              *)   suffix="" ;;
            esac
            expected="[$version, ${version%%.*}.$((${rest%%.*} + 1)).0$suffix)"
            echo "core packed as $version; satellites must declare $expected"
            for pkg in "$dir"/KoalaSoft.Aspire.Hosting.ServiceSources.*.nupkg; do
              if [ "$pkg" = "$core" ]; then continue; fi
              deps=$(unzip -p "$pkg" '*.nuspec' \
                | grep -o '<dependency id="KoalaSoft.Aspire.Hosting.ServiceSources" version="[^"]*"' \
                || true)
              if [ -z "$deps" ]; then
                echo "::error::$(basename "$pkg") declares no dependency on core"
                exit 1
              fi
              unconstrained=$(printf '%s\n' "$deps" | grep -vF "version=\"$expected\"" || true)
              if [ -n "$unconstrained" ]; then
                echo "::error::$(basename "$pkg") does not constrain core to $expected"
                printf '%s\n' "$unconstrained"
                exit 1
              fi
              echo "$(basename "$pkg"): $(printf '%s\n' "$deps" | head -1)"
            done
          done

      # The rule the release shape has to satisfy, stated on its own rather than inferred from
      # the bound above: nuget.org fails the *push* of a stable package whose nuspec mentions a
      # prerelease version anywhere, including as a dependency range's upper bound
      # (NuGetGallery#6948). Nothing local catches it - pack emits at most NU5104, a warning,
      # and the client, restore and GitHub Packages all accept the package. The first signal is
      # a 400 from nuget.org, by which point the tag is pushed and the release is public.
      #
      # Scanned over every version attribute in the nuspec rather than only the core
      # dependency, since the rule is about the manifest as a whole and any third-party
      # dependency could acquire a prerelease bound the same way.
      - name: Verify the release shape carries no prerelease version
        run: |
          for pkg in ./artifacts/stable/*.nupkg; do
            prerelease=$(unzip -p "$pkg" '*.nuspec' \
              | grep -o 'version="[^"]*"' \
              | grep -- '-' \
              || true)
            if [ -n "$prerelease" ]; then
              echo "::error::$(basename "$pkg") is stable but its nuspec declares a prerelease version; nuget.org will reject the push"
              printf '%s\n' "$prerelease"
              exit 1
            fi
          done
          echo "release-shape nuspecs declare no prerelease versions"

      # `polyglot` is the tag `aspire add` reads to decide whether to surface a package to a
      # non-C# AppHost, which is the audience the Aspire Type System exports exist for.
      # Aspire.Hosting.targets appends it, but obj/*.nuget.g.targets imports that file only
      # inside its per-framework ImportGroups, while pack generates the nuspec from the
      # cross-targeting outer pass - so the append landed on a property no nuspec was built
      # from, three times, and every package packed without the tag. Nothing failed.
      # Directory.Build.targets now appends it in the pass that builds the nuspec.
      #
      # That fix is a repo-local PropertyGroup whose whole justification is where NuGet chose
      # to place an import. Someone reading it after a future SDK changes that, or who takes
      # Aspire's targets at their word that the tag is already handled, deletes it - and pack
      # stays green while `aspire add` quietly stops listing these packages. So assert against
      # the packed nuspec rather than the property: the property being set is exactly what was
      # true while the tag was missing.
      #
      # Exactly once, not merely present: what stops Aspire's own append and this one both
      # firing is a string test over the tag list, and a list written differently could slip
      # past it and ship the tag twice.
      #
      # Every packed package, for the same reason as the core-dependency check above: a
      # satellite added later that genuinely is not a polyglot integration has to be excepted
      # here by name, where the exception is visible, rather than by quietly not matching.
      - name: Verify packages carry the polyglot tag
        run: |
          for pkg in ./artifacts/package/*.nupkg; do
            tags=$(unzip -p "$pkg" '*.nuspec' | grep -oE '<tags>[^<]*</tags>' || true)
            # One tag per line before counting: NuGet writes the list space- or
            # semicolon-separated, grep -c would count matching *lines* and so read a tag
            # repeated on the single <tags> line as one, and -x keeps a hypothetical
            # "non-polyglot" from counting as this tag.
            count=$(printf '%s' "$tags" \
              | sed -e 's/<[^>]*>//g' -e 's/[;,]/ /g' \
              | tr ' ' '\n' | grep -cx 'polyglot' || true)
            if [ "$count" != "1" ]; then
              echo "::error::$(basename "$pkg") carries the polyglot tag $count time(s), expected exactly 1"
              echo "$tags"
              exit 1
            fi
            echo "$(basename "$pkg"): $tags"
          done

      - name: Upload test results
        # Test results are most useful exactly when the run failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/package/*.nupkg

  smoketest-container:
    # Runs alongside `build` rather than after it: this is a different kind of workload
    # (a real container runtime, a real AppHost process) and shares nothing with the
    # unit-test job, so serialising them would only add its runtime to the critical path.
    name: 🐳 container source smoke test
    runs-on: ubuntu-latest
    # The script's own waits are bounded, but it launches the AppHost in the background, so
    # this caps the job if that process hangs somewhere the script isn't watching.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads tags to version the referenced package projects; without full
          # history it falls back to a placeholder version and warns while doing it.
          fetch-depth: 0

      # DemoAppHost targets net10.0, but it project-references the multi-targeted package
      # projects, so the 8 and 9 SDKs are installed too rather than relying on which target
      # framework MSBuild settles on for those references.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Keyed apart from the `build` job's cache on purpose. The two jobs run concurrently, so
      # sharing a key means whichever finishes second fails its save -- and worse, this job
      # restores only DemoAppHost, so if it saved under the shared key `build` would restore a
      # cache missing the test and pack dependencies and re-download them every run.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Package versions live in Directory.Packages.props under central package
          # management, so hashing only the project files would keep serving a stale cache
          # across a version change.
          key: nuget-smoketest-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-smoketest-${{ runner.os }}-

      # Docker is preinstalled and running on ubuntu-latest, which is the script's only
      # requirement beyond the .NET SDK. The script pins the image and pre-pulls it itself,
      # so nothing about the image is repeated here.
      - name: Run container source smoke test
        run: ./scripts/smoketest-container-source.sh

      - name: Upload AppHost log
        # The script prints the tail of this log on failure; the whole file is kept as an
        # artifact for the failures where 40 lines are not enough.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoketest-container-apphost-log
          path: .smoketest-cache/apphost.log
          if-no-files-found: ignore

  verify-invariants:
    # Its own job rather than steps on the build: these read files and need neither a restore
    # nor a compile, so they report in seconds instead of behind the build they would
    # otherwise queue against.
    name: 🤖 verify repo invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # PyYAML rather than grep: the two dependabot.yml checks below are about YAML structure
      # - which keys are siblings, and which of them survive parsing - and neither is
      # answerable by matching lines.
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Two invariants that dependabot.yml states in prose and nothing enforces.
      #
      # The first is that the `ignore` list covers every floor in src/Directory.Packages.props.
      # Directory scoping does not keep Dependabot out of src/ - the test projects carry a
      # ProjectReference into it, and the NuGet updater walks that graph and edits whatever
      # Directory.Packages.props declares the id it decided to bump (#80, #89). The per-id
      # `ignore` list is what actually holds, and it is maintained by hand because there is no
      # wildcard for "whatever that file declares". So a satellite that takes on a new
      # dependency is one edit away from a floor Dependabot is free to raise, and the failure
      # is silent: a green PR that moves a version consumers inherit.
      #
      # The second is that no key in the file is duplicated. Two `ignore` keys landed in the
      # same mapping once already, one from each fix for the problem above; YAML keeps the
      # last, so the earlier list parsed and was discarded while still reading as authoritative
      # and still instructing the reader to maintain it. That cost nothing only because the
      # surviving list happened to be a superset of the discarded one.
      - name: Verify Dependabot ignores every floor in src/
        run: |
          python3 - <<'EOF'
          import re, sys, yaml

          DEPENDABOT = ".github/dependabot.yml"
          FLOORS = "src/Directory.Packages.props"

          duplicates = []

          class Loader(yaml.SafeLoader):
              pass

          def keep_duplicates(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      duplicates.append((key, key_node.start_mark.line + 1))
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          Loader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, keep_duplicates
          )

          with open(DEPENDABOT) as f:
              config = yaml.load(f, Loader=Loader)

          failed = False

          for key, line in duplicates:
              print(
                  f"::error file={DEPENDABOT},line={line}::duplicate key '{key}': YAML keeps "
                  f"the last one, so an earlier block with this key is parsed and discarded"
              )
              failed = True

          ignored = set()
          for update in config["updates"]:
              if update.get("package-ecosystem") == "nuget":
                  ignored |= {e["dependency-name"] for e in update.get("ignore", [])}

          with open(FLOORS) as f:
              declared = set(re.findall(r'<PackageVersion\s+Include="([^"]+)"', f.read()))

          # Nothing matched means the file moved or stopped declaring versions this way, not
          # that there is nothing to check: without this the comparison below is empty against
          # empty and passes for as long as it keeps being wrong.
          if not declared:
              print(
                  f"::error file={FLOORS}::no PackageVersion found here - this check is not "
                  f"reading what it thinks it is, and would pass whatever the ignore list said"
              )
              failed = True

          for package in sorted(declared - ignored):
              print(
                  f"::error file={FLOORS}::{package} is declared here, so its version is a "
                  f"floor consumers inherit, but {DEPENDABOT} does not ignore it - Dependabot "
                  f"is free to raise it on a schedule. Add it to the ignore list."
              )
              failed = True

          print(f"{len(declared)} floors declared in {FLOORS}, {len(ignored)} ids ignored:")
          for package in sorted(declared & ignored):
              print(f"  floor, ignored: {package}")
          for package in sorted(declared - ignored):
              print(f"  floor, NOT ignored: {package}")
          for package in sorted(ignored - declared):
              print(f"  ignored, not a floor: {package}")

          sys.exit(1 if failed else 0)
          EOF

      # A third invariant, about a different file pair - and the reason Aspire.Hosting.AppHost
      # sits in that ignore list at all, since it is the one id there that is not a floor.
      #
      # An AppHost states its Aspire version twice. Once as the Aspire.Hosting.AppHost package,
      # which under central package management means the root Directory.Packages.props; and
      # once as `<Sdk Name="Aspire.AppHost.Sdk" Version="..." />` in the csproj, which central
      # package management does not reach because an MSBuild SDK reference is not a
      # PackageReference. Nothing ties the two together.
      #
      # Letting them drift is the split Aspire family this repository warns consumers about,
      # reproduced in its own sample: the SDK pins the DCP and dashboard packages to the
      # version the *project* declares, so a raised package version with the SDK left behind
      # mixes one Aspire version's hosting assemblies with another's orchestrator. That builds
      # green - the mismatch is between packages, not against the compiler - and surfaces when
      # the AppHost is run, which is only the smoke tests and only for the sources they cover.
      - name: Verify the AppHost package and SDK versions match
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET

          CENTRAL = "Directory.Packages.props"
          PACKAGE = "Aspire.Hosting.AppHost"
          SDK = "Aspire.AppHost.Sdk"

          # ElementTree rather than a regex like the check above: this reads two attributes off
          # one element, and MSBuild fixes no order between them, so a pattern anchored on
          # whichever comes first here would miss an equally valid file. These project files
          # declare no xmlns, so the tags come back unqualified.
          declared = [
              e.get("Version")
              for e in ET.parse(CENTRAL).getroot().iter("PackageVersion")
              if e.get("Include") == PACKAGE
          ]

          if len(declared) != 1:
              print(
                  f"::error file={CENTRAL}::expected exactly one PackageVersion for {PACKAGE} "
                  f"here, found {len(declared)} - this check is not reading what it thinks it "
                  f"is, and cannot say what the SDK is supposed to match"
              )
              sys.exit(1)

          version = declared[0]

          # Found by the SDK reference itself rather than by a hardcoded path: a second AppHost
          # project inherits the check instead of quietly falling outside it. Both spellings
          # count - the `<Sdk Name=... Version=... />` element this repository uses, and the
          # `Sdk="Name/Version"` attribute on <Project> that is the same reference written
          # inline.
          apphosts = []
          for path in sorted(glob.glob("**/*.csproj", recursive=True)):
              project = ET.parse(path).getroot()
              for sdk in project.iter("Sdk"):
                  if sdk.get("Name") == SDK:
                      apphosts.append((path, sdk.get("Version")))
              for entry in (project.get("Sdk") or "").split(";"):
                  name, _, inline = entry.strip().partition("/")
                  if name == SDK:
                      apphosts.append((path, inline or None))

          # No AppHost at all means the sample moved or changed shape, not that the versions
          # agree: without this the loop below runs zero times and the step passes for as long
          # as it keeps looking in the wrong place.
          if not apphosts:
              print(
                  f"::error::no project in this repository references the {SDK} MSBuild SDK - "
                  f"this check has nothing to compare and would pass whatever {CENTRAL} said"
              )
              sys.exit(1)

          failed = False

          for path, sdk_version in apphosts:
              if sdk_version is None:
                  print(
                      f"::error file={path}::this project references {SDK} without a version, "
                      f"so the SDK resolves from global.json rather than from the version the "
                      f"project declares. Pin it to {version}, matching {PACKAGE}."
                  )
                  failed = True
              elif sdk_version != version:
                  print(
                      f"::error file={path}::{SDK} is pinned to {sdk_version} here, but "
                      f"{PACKAGE} is {version} in {CENTRAL}. The SDK pins the DCP and dashboard "
                      f"packages to the version the project declares, so these two have to move "
                      f"together - split, they build green and mix Aspire versions at run time."
                  )
                  failed = True
              else:
                  print(f"{path}: {SDK} {sdk_version} matches {PACKAGE} {version}")

          sys.exit(1 if failed else 0)
          EOF
