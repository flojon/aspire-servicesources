name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A PR that gets a second push doesn't need the first run's result any more.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Everything runs in one job so the solution is restored and compiled once; the display
    # name spells out what that single check actually covers.
    name: 🔨 build, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the package version from tags/history, so the pack step
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # The build is warning-clean today; -warnaserror keeps it that way instead of letting
      # warnings accumulate unnoticed in PRs.
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # LogFilePrefix rather than LogFileName: every project multi-targets net8/9/10, and a
      # fixed file name makes each target framework overwrite the previous one's results.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory ./artifacts/test-results

      # Packing on every PR catches packaging-only breakage (missing README/LICENSE, bad
      # metadata) here rather than at release time, where release.yml deliberately has no
      # --skip-duplicate safety net. Packed project by project like preview.yml/release.yml:
      # the solution also holds the sample AppHost and the test projects.
      - name: Pack
        run: |
          dotnet pack src/Aspire.Hosting.ServiceSources/Aspire.Hosting.ServiceSources.csproj -c Release --no-build -o ./artifacts/package
          dotnet pack src/Aspire.Hosting.ServiceSources.Java/Aspire.Hosting.ServiceSources.Java.csproj -c Release --no-build -o ./artifacts/package
          dotnet pack src/Aspire.Hosting.ServiceSources.JavaScript/Aspire.Hosting.ServiceSources.JavaScript.csproj -c Release --no-build -o ./artifacts/package

      # PinCoreDependency in Directory.Build.targets rewrites the satellites' core dependency
      # into a version range, hooking _GetProjectReferenceVersions - a NuGet-internal target.
      # If a future SDK renames or reorders that target the rewrite silently stops happening
      # and the satellites go back to shipping a floor, with nothing else failing. Assert the
      # range reached the packed nuspec instead of trusting the build to notice.
      #
      # The grep matches an unescaped "<dependency": PackageReleaseNotes embeds the changelog,
      # whose XML example contains the same text with &lt; escapes, and would satisfy a looser
      # pattern on its own even if the real dependency element had lost its range.
      #
      # Every packed package except core is checked, rather than a name pattern covering the
      # satellites that exist today: the failure this guards against is silent, so a satellite
      # added later must not be able to slip past by being named something else.
      - name: Verify satellites constrain core
        run: |
          core=$(ls ./artifacts/package/KoalaSoft.Aspire.Hosting.ServiceSources.[0-9]*.nupkg)
          version=$(basename "$core" .nupkg)
          version=${version#KoalaSoft.Aspire.Hosting.ServiceSources.}
          # The bound PinCoreDependency computes: next minor, with -0 so the range excludes
          # that minor's prereleases too. Asserted in full - matching only the floor would
          # pass a range whose upper bound had drifted anywhere at all.
          rest=${version#*.}
          expected="[$version, ${version%%.*}.$((${rest%%.*} + 1)).0-0)"
          echo "core packed as $version; satellites must declare $expected"
          for pkg in ./artifacts/package/KoalaSoft.Aspire.Hosting.ServiceSources.*.nupkg; do
            if [ "$pkg" = "$core" ]; then continue; fi
            deps=$(unzip -p "$pkg" '*.nuspec' \
              | grep -o '<dependency id="KoalaSoft.Aspire.Hosting.ServiceSources" version="[^"]*"' \
              || true)
            if [ -z "$deps" ]; then
              echo "::error::$(basename "$pkg") declares no dependency on core"
              exit 1
            fi
            unconstrained=$(printf '%s\n' "$deps" | grep -vF "version=\"$expected\"" || true)
            if [ -n "$unconstrained" ]; then
              echo "::error::$(basename "$pkg") does not constrain core to $expected"
              printf '%s\n' "$unconstrained"
              exit 1
            fi
            echo "$(basename "$pkg"): $(printf '%s\n' "$deps" | head -1)"
          done

      # The JavaScript satellite ships an MSBuild check in buildTransitive/ that fails a
      # consumer's build when Aspire.Hosting and Aspire.Hosting.JavaScript resolve to different
      # versions. NuGet imports it by exact name - buildTransitive/<PackageId>.targets - and
      # imports nothing at all if the name or folder is wrong, silently, with the consumer's
      # build simply succeeding as it did before the check existed.
      #
      # Getting it into the package is also less obvious than it looks: the SDK's default item
      # globs only run in the per-framework inner builds, while pack runs in the cross-targeting
      # outer build, so the file has to be included explicitly. That already failed once during
      # development and produced a package that was correct in every other respect.
      #
      # AspireFamilyVersionCheckTests covers what the file does. This covers it arriving.
      - name: Verify the JavaScript satellite ships its Aspire version check
        run: |
          pkg=$(ls ./artifacts/package/KoalaSoft.Aspire.Hosting.ServiceSources.JavaScript.[0-9]*.nupkg)
          expected="buildTransitive/KoalaSoft.Aspire.Hosting.ServiceSources.JavaScript.targets"
          if ! unzip -l "$pkg" | grep -qF "$expected"; then
            echo "::error::$(basename "$pkg") is missing $expected - NuGet would import nothing and the check would never run"
            unzip -l "$pkg"
            exit 1
          fi
          echo "$(basename "$pkg"): ships $expected"

      - name: Upload test results
        # Test results are most useful exactly when the run failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/package/*.nupkg

  smoketest-container:
    # Runs alongside `build` rather than after it: this is a different kind of workload
    # (a real container runtime, a real AppHost process) and shares nothing with the
    # unit-test job, so serialising them would only add its runtime to the critical path.
    name: 🐳 container source smoke test
    runs-on: ubuntu-latest
    # The script's own waits are bounded, but it launches the AppHost in the background, so
    # this caps the job if that process hangs somewhere the script isn't watching.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads tags to version the referenced package projects; without full
          # history it falls back to a placeholder version and warns while doing it.
          fetch-depth: 0

      # DemoAppHost targets net10.0, but it project-references the multi-targeted package
      # projects, so the 8 and 9 SDKs are installed too rather than relying on which target
      # framework MSBuild settles on for those references.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Keyed apart from the `build` job's cache on purpose. The two jobs run concurrently, so
      # sharing a key means whichever finishes second fails its save -- and worse, this job
      # restores only DemoAppHost, so if it saved under the shared key `build` would restore a
      # cache missing the test and pack dependencies and re-download them every run.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-smoketest-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-smoketest-${{ runner.os }}-

      # Docker is preinstalled and running on ubuntu-latest, which is the script's only
      # requirement beyond the .NET SDK. The script pins the image and pre-pulls it itself,
      # so nothing about the image is repeated here.
      - name: Run container source smoke test
        run: ./scripts/smoketest-container-source.sh

      - name: Upload AppHost log
        # The script prints the tail of this log on failure; the whole file is kept as an
        # artifact for the failures where 40 lines are not enough.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoketest-container-apphost-log
          path: .smoketest-cache/apphost.log
          if-no-files-found: ignore
