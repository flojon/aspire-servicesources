name: CI

# Deliberately unfiltered by base branch. A `branches: [main]` filter looks harmless until a PR
# is stacked on another PR's branch, which is normal here: that PR then matches no trigger, runs
# no job, and shows a check list that looks complete because the checks that would have failed
# never reported. workflow_dispatch is the escape hatch for that, but it only helps whoever
# already knows the gap exists, so the filter is gone instead. The cost is running CI on PRs
# targeting branches that are not main, which is exactly what was missing.
on:
  pull_request:
  workflow_dispatch:

# A PR that gets a second push doesn't need the first run's result any more.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Everything runs in one job so the solution is restored and compiled once; the display
    # name spells out what that single check actually covers.
    name: 🔨 build, test & pack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the package version from tags/history, so the pack step
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Hashes every file that can change which packages restore downloads. The list has
          # to be complete rather than representative: on an exact primary-key hit
          # actions/cache skips the save, so a file left out of the key does not merely serve
          # a stale entry once - it serves the pre-bump entry and then never stores the
          # post-bump downloads, and every later run re-downloads them.
          #   - Directory.Packages.props, because central package management is where package
          #     versions live and a csproj-only hash would miss a bump
          #   - Directory.Build.props, because $(AspireVersion) is the number the Aspire
          #     entries there resolve to: Directory.Packages.props holds the property
          #     reference, whose text does not change when the version does
          #   - global.json, because the Aspire.AppHost.Sdk version cannot be an MSBuild
          #     property and so appears in no props file at all
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # The build is warning-clean today; -warnaserror keeps it that way instead of letting
      # warnings accumulate unnoticed in PRs.
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # LogFilePrefix rather than LogFileName: every project multi-targets net8/9/10, and a
      # fixed file name makes each target framework overwrite the previous one's results.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory ./artifacts/test-results

      # Packing on every PR catches packaging-only breakage (missing README/LICENSE, bad
      # metadata) here rather than at release time, where release.yml deliberately has no
      # --skip-duplicate safety net. Packed project by project like preview.yml/release.yml:
      # the solution also holds the sample AppHost and the test projects.
      - name: Pack
        run: |
          dotnet pack src/Aspire.Hosting.ServiceSources/Aspire.Hosting.ServiceSources.csproj -c Release --no-build -o ./artifacts/package

      # Everything above packs whatever MinVer computes for the commit, which off a tag is
      # always a prerelease - so without this, no pack in CI would ever produce the shape that
      # actually gets pushed to nuget.org. That mattered sharply while a satellite's core
      # dependency was rewritten into a range whose prerelease upper bound nuget.org rejects at
      # push time: v0.3.0 tagged, built, packed and passed every check here, then failed the
      # push. The range is gone with the satellites, but the class of failure is not - any
      # dependency can acquire a prerelease bound, and the scan below is what catches it.
      #
      # The version is synthetic and never published; it only has to be stable, and to have a
      # minor that differs from the patch so a bound built from the wrong component cannot
      # coincidentally match.
      #
      # PackageReleaseNotes is set explicitly for two reasons, and the second is load-bearing.
      # It keeps the changelog target from warning that 9.9.9 has no section - that target
      # fills the property only when it is empty. And it keeps the changelog *out* of this
      # nuspec: an entry documenting a version range in an XML example escapes only < and >,
      # so the literal text version="[0.3.0, 0.4.0-0)" would survive into the manifest and trip
      # the prerelease scan below on prose.
      - name: Pack the release shape
        run: |
          dotnet pack src/Aspire.Hosting.ServiceSources/Aspire.Hosting.ServiceSources.csproj -c Release -o ./artifacts/stable \
            -p:MinVerVersionOverride=9.9.9 \
            -p:PackageReleaseNotes="release-shape check"

      # The rule the release shape has to satisfy, stated on its own rather than inferred from
      # the bound above: nuget.org fails the *push* of a stable package whose nuspec mentions a
      # prerelease version anywhere, including as a dependency range's upper bound
      # (NuGetGallery#6948). Nothing local catches it - pack emits at most NU5104, a warning,
      # and the client, restore and GitHub Packages all accept the package. The first signal is
      # a 400 from nuget.org, by which point the tag is pushed and the release is public.
      #
      # Scanned over every version attribute in the nuspec rather than only the core
      # dependency, since the rule is about the manifest as a whole and any third-party
      # dependency could acquire a prerelease bound the same way.
      - name: Verify the release shape carries no prerelease version
        run: |
          for pkg in ./artifacts/stable/*.nupkg; do
            prerelease=$(unzip -p "$pkg" '*.nuspec' \
              | grep -o 'version="[^"]*"' \
              | grep -- '-' \
              || true)
            if [ -n "$prerelease" ]; then
              echo "::error::$(basename "$pkg") is stable but its nuspec declares a prerelease version; nuget.org will reject the push"
              printf '%s\n' "$prerelease"
              exit 1
            fi
          done
          echo "release-shape nuspecs declare no prerelease versions"

      # `polyglot` is the tag `aspire add` reads to decide whether to surface a package to a
      # non-C# AppHost, which is the audience the Aspire Type System exports exist for.
      # Aspire.Hosting.targets appends it, but obj/*.nuget.g.targets imports that file only
      # inside its per-framework ImportGroups, while pack generates the nuspec from the
      # cross-targeting outer pass - so the append landed on a property no nuspec was built
      # from, three times, and every package packed without the tag. Nothing failed.
      # Directory.Build.targets now appends it in the pass that builds the nuspec.
      #
      # That fix is a repo-local PropertyGroup whose whole justification is where NuGet chose
      # to place an import. Someone reading it after a future SDK changes that, or who takes
      # Aspire's targets at their word that the tag is already handled, deletes it - and pack
      # stays green while `aspire add` quietly stops listing these packages. So assert against
      # the packed nuspec rather than the property: the property being set is exactly what was
      # true while the tag was missing.
      #
      # Exactly once, not merely present: what stops Aspire's own append and this one both
      # firing is a string test over the tag list, and a list written differently could slip
      # past it and ship the tag twice.
      #
      # Loops over every packed package rather than naming core, so that a second packable
      # project added later that genuinely is not a polyglot integration has to be excepted
      # here by name, where the exception is visible, rather than by quietly not matching.
      - name: Verify packages carry the polyglot tag
        run: |
          for pkg in ./artifacts/package/*.nupkg; do
            tags=$(unzip -p "$pkg" '*.nuspec' | grep -oE '<tags>[^<]*</tags>' || true)
            # One tag per line before counting: NuGet writes the list space- or
            # semicolon-separated, grep -c would count matching *lines* and so read a tag
            # repeated on the single <tags> line as one, and -x keeps a hypothetical
            # "non-polyglot" from counting as this tag.
            count=$(printf '%s' "$tags" \
              | sed -e 's/<[^>]*>//g' -e 's/[;,]/ /g' \
              | tr ' ' '\n' | grep -cx 'polyglot' || true)
            if [ "$count" != "1" ]; then
              echo "::error::$(basename "$pkg") carries the polyglot tag $count time(s), expected exactly 1"
              echo "$tags"
              exit 1
            fi
            echo "$(basename "$pkg"): $tags"
          done

      - name: Upload test results
        # Test results are most useful exactly when the run failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./artifacts/test-results
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/package/*.nupkg

  smoketest-container:
    # Runs alongside `build` rather than after it: this is a different kind of workload
    # (a real container runtime, a real AppHost process) and shares nothing with the
    # unit-test job, so serialising them would only add its runtime to the critical path.
    name: 🐳 container source smoke test
    runs-on: ubuntu-latest
    # The script's own waits are bounded, but it launches the AppHost in the background, so
    # this caps the job if that process hangs somewhere the script isn't watching.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads tags to version the referenced package projects; without full
          # history it falls back to a placeholder version and warns while doing it.
          fetch-depth: 0

      # DemoAppHost targets net10.0, but it project-references the multi-targeted package
      # projects, so the 8 and 9 SDKs are installed too rather than relying on which target
      # framework MSBuild settles on for those references.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Keyed apart from the `build` job's cache on purpose. The two jobs run concurrently, so
      # sharing a key means whichever finishes second fails its save -- and worse, this job
      # restores only DemoAppHost, so if it saved under the shared key `build` would restore a
      # cache missing the test and pack dependencies and re-download them every run.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Same file list, and the same reason for it, as the build job's cache above: every
          # file that can change what restore downloads has to be in the key, because
          # actions/cache skips the save on an exact primary-key hit.
          key: nuget-smoketest-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-smoketest-${{ runner.os }}-

      # Docker is preinstalled and running on ubuntu-latest, which is the script's only
      # requirement beyond the .NET SDK. The script pins the image and pre-pulls it itself,
      # so nothing about the image is repeated here.
      - name: Run container source smoke test
        run: ./scripts/smoketest-container-source.sh

      - name: Upload AppHost log
        # The script prints the tail of this log on failure; the whole file is kept as an
        # artifact for the failures where 40 lines are not enough.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoketest-container-apphost-log
          path: .smoketest-cache/apphost.log
          if-no-files-found: ignore

  smoketest-config-layers:
    # Alongside `build` for the same reason smoketest-container is: a real AppHost process,
    # sharing nothing with the unit-test job.
    name: 🪜 config layers smoke test
    runs-on: ubuntu-latest
    # Every run in this script is expected to fail fast at composition, so it is quick; the cap
    # is here because it launches the AppHost seven times and one of those could hang.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads tags to version the referenced package projects; without full
          # history it falls back to a placeholder version and warns while doing it.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Its own key, for the reason spelled out on smoketest-container's cache: these jobs run
      # concurrently, and a job that restores only DemoAppHost must not be the one that saves
      # under a key another job restores from.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-smoketest-config-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-smoketest-config-${{ runner.os }}-

      # No container runtime and no network: the script's runs all end at AddService, because the
      # layer under test names a source that does not exist.
      - name: Run config layers smoke test
        run: ./scripts/smoketest-config-layers.sh

      - name: Upload AppHost logs
        # One log per run, named for the layer it was proving, so a failure can be read against
        # the step that reported it.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoketest-config-layers-logs
          path: .smoketest-cache/config-layers-*.log
          if-no-files-found: ignore

  smoketest-local-source:
    name: 📦 local source smoke test
    runs-on: ubuntu-latest
    # Longer than the config-layers job: each of its three runs clones a repository and lets
    # Aspire restore and build the checkout before anything starts.
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-smoketest-local-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-smoketest-local-${{ runner.os }}-

      # git is preinstalled on ubuntu-latest, and the repository the script clones is one it
      # creates itself, so this needs no network and no container runtime.
      - name: Run local source smoke test
        run: ./scripts/smoketest-local-source.sh

      - name: Upload AppHost log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoketest-local-source-apphost-log
          path: .smoketest-cache/local-source-apphost.log
          if-no-files-found: ignore

  typecheck-typescript:
    # samples/DemoAppHostTypeScript is the only thing here that compiles what these packages
    # export to Aspire's Type System, and codegen is where that surface breaks: a signature the
    # generator cannot project emits TypeScript referencing types it never declared. The
    # AddService_IsExportedToAts test and the ASPIREEXPORT* analyzers both stop at the
    # declarations - neither sees the emitted output.
    #
    # Runs alongside `build`, like smoketest-container: its restore and toolchain are its own.
    #
    # Deliberately not filtered by `paths`. The export surface is reachable from most of src/,
    # and a required check a path filter skips never reports at all - it sits pending and blocks
    # the merge. aspire-matrix.yml documents the same trap from the side where a filter is safe.
    name: 📘 typescript export surface
    runs-on: ubuntu-latest
    # Nothing here starts an AppHost; this only caps a hung restore or codegen.
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # Pinned rather than floating, because this job compiles generated code: a CLI release
      # that changed codegen would redden whichever PR ran next, for a break no PR caused.
      #
      # The CLI pins its own version into the host project it generates - measured, 13.5.2
      # emits Aspire.Hosting 13.5.2 and 13.5.3 emits 13.5.3 - so a CLI below $(AspireVersion)
      # in Directory.Build.props fails `aspire restore` with NU1605 (package downgrade) before
      # codegen runs. That makes 13.5.2 the oldest CLI clearing today's floor; this pins the
      # newest release instead, so the surface is checked against the generator a contributor
      # gets. `verify repo invariants` fails if this pin and that floor part company.
      ASPIRE_CLI_VERSION: '13.5.3'

    steps:
      - uses: actions/checkout@v7
        with:
          # codegen builds this package from ../../src, and MinVer falls back to a placeholder
          # version, warning as it goes, if the tags are not there to read.
          fetch-depth: 0

      # The package the sample points at multi-targets net8.0/9.0/10.0 and codegen restores it,
      # so install all three rather than rely on which target framework MSBuild settles on.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-node@v7
        with:
          # Matches the @types/node major the sample declares: those types are the standard
          # library strict tsc checks the AppHost's own Node usage against, and a runner default
          # drifting from them would check this against a different one than a contributor gets.
          node-version: '22'
          cache: npm
          cache-dependency-path: samples/DemoAppHostTypeScript/package-lock.json

      # Keyed apart from the other jobs' caches, as smoketest-container spells out: these run
      # concurrently and this one restores only what codegen pulls in, so a shared key would
      # have it save a cache `build` then restores incomplete.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Directory.Build.props is hashed too: $(AspireVersion), the floor this restores
          # against, lives in neither the project nor the central package files.
          key: nuget-typescript-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-typescript-${{ runner.os }}-

      # As a dotnet tool rather than through aspire.dev's install script: the version resolves
      # from nuget.org like every other dependency here, and a tool path keeps it out of the
      # runner's global state.
      - name: Install the Aspire CLI
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/aspire-cli" aspire.cli --version "$ASPIRE_CLI_VERSION"
          echo "$RUNNER_TEMP/aspire-cli" >> "$GITHUB_PATH"

      - name: Install the sample's npm dependencies
        working-directory: samples/DemoAppHostTypeScript
        run: npm ci

      # aspire.config.json points at ../../src rather than a published version, so this
      # generates the export surface of the commit under test.
      #
      # No `rm -rf .aspire` first - a runner starts without one. It matters when reproducing
      # this by hand: `aspire restore` rewrites the pinned version in the IntegrationRestore
      # project it generates without rebuilding it, so a previous CLI's generator survives in
      # that project's bin/ and keeps emitting its old output while reporting success
      # (microsoft/aspire#19603). The whole .aspire/ directory has to go, not just modules/.
      - name: Generate the TypeScript SDK
        working-directory: samples/DemoAppHostTypeScript
        run: aspire restore --non-interactive --nologo

      # The step that actually gates the surface: `aspire restore` above reports having
      # generated the SDK, not the SDK being valid, and exits 0 either way.
      #
      # tsconfig.apphost.json includes .aspire/modules/**/*.mts deliberately - excluding those
      # generated modules to get a green check would typecheck all but the thing under test.
      - name: Typecheck the generated SDK
        working-directory: samples/DemoAppHostTypeScript
        run: npx tsc --noEmit -p tsconfig.apphost.json

      # A failure above is a diagnostic pointing by line into two megabytes of machine-written
      # TypeScript that exists only on the runner.
      - name: Upload the generated SDK
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-typescript-sdk
          path: samples/DemoAppHostTypeScript/.aspire/modules
          if-no-files-found: ignore

  verify-invariants:
    # Its own job: these read files and need neither a restore nor a compile, so they report
    # in seconds instead of behind the build they would otherwise queue against.
    name: 🤖 verify repo invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # grep answers neither dependabot.yml question below: both are about YAML structure -
      # which keys are siblings, and which of them survive parsing.
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Two invariants dependabot.yml states in prose and nothing enforces.
      #
      # That the nuget `ignore` list covers every floor, whether it is declared in
      # src/Directory.Packages.props or named as a floor by core's buildTransitive/ targets.
      # Directory scoping does not keep the updater out of src/ (that file's header, #80,
      # #89), so the per-id list is what actually holds - maintained by hand, since there is
      # no wildcard for "whatever those files declare". Core taking on a new dependency is one
      # edit away from a floor Dependabot may raise, silently.
      #
      # And that no key is duplicated. Two `ignore` keys in one mapping has happened here:
      # YAML keeps the last, so the earlier list parsed and was discarded while still reading
      # as authoritative.
      - name: Verify Dependabot ignores every floor in src/
        run: |
          python3 - <<'EOF'
          import re, sys, yaml

          DEPENDABOT = ".github/dependabot.yml"
          FLOORS = "src/Directory.Packages.props"
          # The two guest-language hosting packages are floors too, and are the one kind that is
          # not declared in FLOORS: core references them with PrivateAssets="all", so they are
          # not dependencies consumers inherit, and their versions live in the root
          # Directory.Packages.props because the kind test projects reference them for real.
          # They are still floors in the sense that matters here - the version core compiles
          # against is the oldest a consumer may bring, since the runtime rolls an assembly
          # reference forward but not back - so a raise is as deliberate as any other. This
          # file is where they are named as floors, so it is the second source of truth.
          GUEST_FLOORS = "src/Aspire.Hosting.ServiceSources/buildTransitive/KoalaSoft.Aspire.Hosting.ServiceSources.targets"

          duplicates = []

          class Loader(yaml.SafeLoader):
              pass

          def keep_duplicates(loader, node, deep=False):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in mapping:
                      duplicates.append((key, key_node.start_mark.line + 1))
                  mapping[key] = loader.construct_object(value_node, deep=deep)
              return mapping

          Loader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, keep_duplicates
          )

          with open(DEPENDABOT) as f:
              config = yaml.load(f, Loader=Loader)

          failed = False

          for key, line in duplicates:
              print(
                  f"::error file={DEPENDABOT},line={line}::duplicate key '{key}': YAML keeps "
                  f"the last one, so an earlier block with this key is parsed and discarded"
              )
              failed = True

          ignored = set()
          for update in config["updates"]:
              if update.get("package-ecosystem") == "nuget":
                  ignored |= {e["dependency-name"] for e in update.get("ignore", [])}

          # Each id remembers which file declares it, so a diagnostic points at the file the
          # reader has to edit. Without that, a guest-language id would be annotated against
          # FLOORS - the one file where those are deliberately not declared.
          sources = {}

          with open(FLOORS) as f:
              for package in re.findall(r'<PackageVersion\s+Include="([^"]+)"', f.read()):
                  sources.setdefault(package, FLOORS)

          with open(GUEST_FLOORS) as f:
              guest = set(re.findall(r"'%\(NuGetPackageId\)'\s*==\s*'([^']+)'", f.read()))

          for package in guest:
              sources.setdefault(package, GUEST_FLOORS)

          if not guest:
              print(
                  f"::error file={GUEST_FLOORS}::no package id found here - this check is not "
                  f"reading what it thinks it is, and would stop covering the guest-language floors"
              )
              failed = True

          declared = set(sources)

          # Not "nothing to check": an empty set compares clean against anything, so without
          # this the step passes for as long as it keeps reading the wrong file.
          if not declared:
              print(
                  f"::error file={FLOORS}::no PackageVersion found here - this check is not "
                  f"reading what it thinks it is, and would pass whatever the ignore list said"
              )
              failed = True

          for package in sorted(declared - ignored):
              print(
                  f"::error file={sources[package]}::{package} is a floor stated here, so it is "
                  f"the oldest version a consumer may bring, but {DEPENDABOT} does not ignore it "
                  f"- Dependabot is free to raise it on a schedule. Add it to the ignore list."
              )
              failed = True

          print(f"{len(declared)} floors found, {len(ignored)} ids ignored:")
          for package in sorted(declared & ignored):
              print(f"  floor, ignored: {package}")
          for package in sorted(declared - ignored):
              print(f"  floor, NOT ignored: {package}")
          for package in sorted(ignored - declared):
              print(f"  ignored, not a floor: {package}")

          sys.exit(1 if failed else 0)
          EOF

      # A third invariant, and the reason Aspire.Hosting.AppHost is in that ignore list at all
      # rather than being a floor. An AppHost states its Aspire version twice, and only one of
      # the two can be an MSBuild property: the Aspire.Hosting.AppHost package reads
      # $(AspireVersion) through central package management, while the Aspire.AppHost.Sdk
      # MSBuild SDK is resolved before any property is evaluated and so has to be a literal in
      # global.json. Split, they mix one Aspire version's hosting assemblies with another's
      # orchestrator: green at build time, broken when the AppHost runs (#89).
      #
      # Three checks rather than a comparison of two literals, because the shapes that split
      # the pair are not only "the numbers differ":
      #
      #   - the package still reads the property, rather than having been re-pinned to a
      #     literal that a -p:AspireVersion override cannot reach (#116)
      #   - global.json states the same version the property defaults to
      #   - no csproj carries an inline `<Sdk Version="..." />`, which outranks global.json
      #     with no warning and no MSB4241 - the silence that let #116 go unnoticed
      - name: Verify the AppHost's two Aspire versions move together
        run: |
          python3 - <<'EOF'
          import glob, json, sys, xml.etree.ElementTree as ET

          CENTRAL = "Directory.Packages.props"
          BUILD = "Directory.Build.props"
          GLOBAL = "global.json"
          PACKAGE = "Aspire.Hosting.AppHost"
          SDK = "Aspire.AppHost.Sdk"
          PROPERTY = "AspireVersion"

          failed = False

          # ElementTree rather than a regex like the check above: these read attributes and
          # element text off MSBuild XML, which fixes no order between attributes. No xmlns
          # in either file, so tags are plain.
          declared = [
              e.get("Version")
              for e in ET.parse(CENTRAL).getroot().iter("PackageVersion")
              if e.get("Include") == PACKAGE
          ]

          if len(declared) != 1:
              print(
                  f"::error file={CENTRAL}::expected exactly one PackageVersion for {PACKAGE} "
                  f"here, found {len(declared)} - so this check cannot say which version the "
                  f"SDK is supposed to match"
              )
              sys.exit(1)

          # The package's half has to stay a property reference rather than a literal that
          # happens to agree today: aspire-matrix.yml moves the family by overriding that
          # property, and a literal here is invisible to the override however correct it looks.
          if declared[0] != f"$({PROPERTY})":
              print(
                  f"::error file={CENTRAL}::{PACKAGE} is set to '{declared[0]}' here, but it has "
                  f"to read $({PROPERTY}) so that overriding that property moves it with the "
                  f"rest of the Aspire family. A literal here is what had aspire-matrix.yml "
                  f"building a mixed-version family (#116)."
              )
              failed = True

          # The property's default: the floor every build that overrides nothing resolves.
          defaults = [
              e.text.strip()
              for e in ET.parse(BUILD).getroot().iter(PROPERTY)
              if e.text and e.text.strip()
          ]

          if len(defaults) != 1:
              print(
                  f"::error file={BUILD}::expected exactly one <{PROPERTY}> default here, found "
                  f"{len(defaults)} - so this check cannot say what {GLOBAL} is supposed to "
                  f"match, and would pass whatever {GLOBAL} said"
              )
              sys.exit(1)

          version = defaults[0]

          # Read the file before asking what is in it, so that "someone deleted or broke
          # global.json" reaches the annotation below rather than failing the step with a
          # traceback - the deleted case being exactly what the missing-key message further
          # down is written to explain. ValueError rather than json.JSONDecodeError, because
          # it also catches the UnicodeDecodeError from a file saved as UTF-16, which is a
          # ValueError but not an OSError and so would otherwise escape.
          try:
              global_json = json.load(open(GLOBAL))
          except (OSError, ValueError) as error:
              print(
                  f"::error file={GLOBAL}::cannot be read as JSON ({error}). This is where the "
                  f"{SDK} version has to live, since an <Sdk> version cannot be an MSBuild "
                  f"property, so without it the sample AppHost has no version for the SDK and "
                  f"restore fails with MSB4236."
              )
              sys.exit(1)

          # Checked for shape rather than trusted to be a mapping: `null`, a list and a bare
          # string are all valid JSON that json.load accepts and .get does not survive, so
          # duck-typing this would trade the annotation for an AttributeError. Anything that
          # is not a mapping of msbuild-sdks holding this SDK leaves the version unfound,
          # which the missing-key arm below already has the message for.
          sdk_versions = global_json.get("msbuild-sdks") if isinstance(global_json, dict) else None
          sdk_version = sdk_versions.get(SDK) if isinstance(sdk_versions, dict) else None

          if sdk_version is None:
              print(
                  f"::error file={GLOBAL}::msbuild-sdks does not name {SDK}, so the sample "
                  f"AppHost has no version for it and restore fails with MSB4236. It belongs "
                  f"here because an <Sdk> version cannot be an MSBuild property."
              )
              failed = True
          elif sdk_version != version:
              print(
                  f"::error file={GLOBAL}::{SDK} is {sdk_version} here, but ${PROPERTY} defaults "
                  f"to {version} in {BUILD}. These are the two literals that have to move "
                  f"together by hand - split, the build stays green and the AppHost mixes "
                  f"Aspire versions at run time (#89)."
              )
              failed = True
          else:
              print(f"{GLOBAL}: {SDK} {sdk_version} matches ${PROPERTY} {version}")

          # Found by the SDK reference rather than by path, so a second AppHost inherits the
          # check instead of quietly falling outside it. Both spellings count: the `<Sdk />`
          # element used here, and the equivalent `Sdk="Name/Version"` attribute on <Project>.
          apphosts = []
          for path in sorted(glob.glob("**/*.csproj", recursive=True)):
              project = ET.parse(path).getroot()
              for sdk in project.iter("Sdk"):
                  if sdk.get("Name") == SDK:
                      apphosts.append((path, sdk.get("Version")))
              for entry in (project.get("Sdk") or "").split(";"):
                  name, _, inline = entry.strip().partition("/")
                  if name == SDK:
                      apphosts.append((path, inline or None))

          # Not "every project agrees": the loop below would run zero times and pass for as
          # long as this kept looking in the wrong place.
          if not apphosts:
              print(
                  f"::error::no project in this repository references the {SDK} MSBuild SDK - "
                  f"this check has nothing to hold and would pass whatever {GLOBAL} said"
              )
              sys.exit(1)

          for path, inline in apphosts:
              if inline is not None:
                  print(
                      f'::error file={path}::{SDK} carries Version="{inline}" here. An inline '
                      f"version outranks {GLOBAL} silently - no warning, no MSB4241 - so "
                      f"aspire-matrix.yml's per-leg override would look effective while "
                      f"changing nothing (#116). Drop it; the version lives in {GLOBAL}."
                  )
                  failed = True
              else:
                  print(f"{path}: {SDK} takes its version from {GLOBAL}")

          sys.exit(1 if failed else 0)
          EOF

      # A fourth invariant, this one over ci.yml itself. The Aspire CLI pins its own Aspire
      # version into the host project it generates, so the CLI `typescript export surface`
      # installs has to be at least this repository's Aspire floor; below it, `aspire restore`
      # fails with NU1605 before codegen runs and that job reports a version-resolution error
      # rather than anything about the export surface. Raising $(AspireVersion) and leaving the
      # pin behind is how that happens - a floor bump breaking a job that never mentions it.
      - name: Verify the pinned Aspire CLI covers the Aspire floor
        run: |
          python3 - <<'EOF'
          import re, sys, yaml

          WORKFLOW = ".github/workflows/ci.yml"
          PROPS = "Directory.Build.props"
          JOB = "typecheck-typescript"

          with open(WORKFLOW) as f:
              workflow = yaml.safe_load(f)

          # Read off the parsed job, not grepped out of the text: a grep would match the pin
          # just as happily after it stopped being a job-level env entry.
          job = workflow.get("jobs", {}).get(JOB)
          if job is None:
              print(
                  f"::error file={WORKFLOW}::no '{JOB}' job here - this check compares that "
                  f"job's pinned CLI against the Aspire floor and has nothing to read"
              )
              sys.exit(1)

          pinned = (job.get("env") or {}).get("ASPIRE_CLI_VERSION")
          if pinned is None:
              print(
                  f"::error file={WORKFLOW}::the '{JOB}' job declares no ASPIRE_CLI_VERSION, so "
                  f"the CLI it installs is no longer pinned where this check can see it"
              )
              sys.exit(1)

          with open(PROPS) as f:
              floors = re.findall(r"<AspireVersion[^>]*>([^<]+)</AspireVersion>", f.read())

          # Exactly one, not "the first": the property carries a Condition so an override wins,
          # and a second declaration would make the floor a matter of evaluation order this
          # check does not model.
          if len(floors) != 1:
              print(
                  f"::error file={PROPS}::expected exactly one AspireVersion here, found "
                  f"{len(floors)} - so this check cannot say what the floor is"
              )
              sys.exit(1)

          floor = floors[0].strip()

          def components(version, where):
              # str() because an unquoted `13.5` is a YAML float and `13` an int, and this
              # check owes a future editor its own error message rather than a traceback.
              version = str(version)
              if not re.fullmatch(r"\d+(\.\d+)*", version):
                  print(
                      f"::error file={where}::'{version}' is not a plain numeric version; this "
                      f"check orders versions componentwise and cannot place a prerelease"
                  )
                  sys.exit(1)
              return tuple(int(part) for part in version.split("."))

          if components(pinned, WORKFLOW) < components(floor, PROPS):
              print(
                  f"::error file={WORKFLOW}::the '{JOB}' job installs Aspire CLI {pinned}, older "
                  f"than the {floor} Aspire floor in {PROPS}. The CLI pins its own version into "
                  f"the host project it generates, so `aspire restore` fails with NU1605 before "
                  f"codegen runs. Raise ASPIRE_CLI_VERSION to {floor} or newer."
              )
              sys.exit(1)

          print(f"Aspire CLI pinned to {pinned}, at or above the {floor} floor in {PROPS}")
          EOF
