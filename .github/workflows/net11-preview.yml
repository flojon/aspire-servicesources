name: .NET 11 preview smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Exploratory only: verifies the existing net8/9/10 build+test still works under a
    # preview SDK ahead of .NET 11 GA. Must not block merges or releases while APIs
    # can still change, so failures here are surfaced but never fail the workflow.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release
