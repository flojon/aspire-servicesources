name: .NET 11 preview smoke test

# Looks ahead at the next .NET, in two ways at once: that the shipped net8/9/10 build and tests
# still work when a preview SDK is the one compiling them, and that the code actually compiles
# and passes when targeting net11.0 itself.
#
# The second half is the one that needs opting into. IncludeNet11Preview adds net11.0 to every
# multi-targeted project (see Directory.Build.targets); without it a preview SDK would happily
# build the existing frameworks and say nothing about the new one.
#
# Runs on a schedule rather than per-commit, because what it watches moves on Microsoft's
# calendar and not on this repo's. Tying it to pushes would probe .NET 11 on a README edit and
# skip a fortnight in which three previews shipped, at twenty minutes of runner time per PR for
# a result that says nothing about the PR. Weekly matches roughly how often a preview lands.
#
# Two things to know about scheduled workflows: they run only from the default branch, so
# changes here do nothing until merged, and GitHub disables a cron after 60 days with no repo
# activity (it emails first). Use workflow_dispatch to probe a specific preview on demand.
on:
  schedule:
    # Mondays 06:17 UTC. Off the hour deliberately - scheduled runs bunch up at :00 and get
    # queued, and nothing here needs a punctual start.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: net11-preview
  cancel-in-progress: true

jobs:
  smoke-test:
    name: 🔭 .NET 11 preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job is allowed to fail loudly. A preview SDK and its framework are both moving
    # targets, so a red run here is information about .NET 11 rather than a defect in any
    # particular change - but it is information worth being told about, and GitHub emails the
    # repo owner when a scheduled workflow fails. Suppressing the failure to keep the run green
    # would leave a signal that only reaches someone who thinks to open a passing check.
    #
    # Nothing is gated by this either way: the job is not attached to pull requests, so it has
    # no check to block a merge with.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads tags to version the package projects.
          fetch-depth: 0

      # Both SDK sets are installed, and in this order: the released ones provide the targeting
      # packs for net8/9/10, and the preview goes last so it is the SDK that drives the build.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Which preview this was is the first thing worth knowing about a failure, and it changes
      # under the workflow without the workflow changing.
      - name: Report SDK versions
        run: |
          echo "dotnet --version: $(dotnet --version)"
          echo "installed SDKs:"
          dotnet --list-sdks

      # Not cached: the point is a cold resolve against whatever the preview feed currently
      # holds, and a cache keyed on unchanged csproj files would serve a stale preview.
      - name: Build
        run: dotnet build -c Release -p:IncludeNet11Preview=true

      - name: Test
        run: dotnet test -c Release --no-build -p:IncludeNet11Preview=true --logger "trx;LogFilePrefix=results" --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-net11-preview
          path: ./artifacts/test-results
          if-no-files-found: warn
