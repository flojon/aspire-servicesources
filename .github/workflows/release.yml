name: Publish release package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to obtain the nuget.org OIDC trusted-publishing token

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test -c Release

      # Packed project by project rather than solution-wide: the solution also holds the sample
      # AppHost and the test projects, which must never reach a feed. Add a line per new package.
      - name: Pack
        run: |
          dotnet pack src/Aspire.Hosting.ServiceSources/Aspire.Hosting.ServiceSources.csproj -c Release -o ./artifacts
          dotnet pack src/Aspire.Hosting.ServiceSources.Java/Aspire.Hosting.ServiceSources.Java.csproj -c Release -o ./artifacts
          dotnet pack src/Aspire.Hosting.ServiceSources.JavaScript/Aspire.Hosting.ServiceSources.JavaScript.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # No --skip-duplicate: every release tag is a new, immutable version, so a 409 here should
        # always fail the workflow rather than being silently swallowed - --skip-duplicate treats
        # ANY 409 as a benign "already published this exact version", which also masked a rejection
        # for an unrelated reason (a reserved ID prefix owned by someone else) as a false success.
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

  # main publishes a preview per commit; a release makes the ones behind it obsolete. Pruned
  # on release rather than on every preview push so previews stay installable in between.
  #
  # Skipped for a prerelease release. A GitHub release marked pre-release fires the same
  # "published" event, which is how an rc reaches nuget.org, but it supersedes nothing: the
  # previews behind it are still the newest builds of unreleased work, and pruning them would
  # delete the stream this job exists to bound rather than trim it.
  prune-previews:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      packages: write

    # Every package published by preview.yml needs pruning, or its version list is the one that
    # grows without bound. Add a name here whenever a package is added to the pack steps above.
    strategy:
      # The action takes one package-name, so each published package gets its own job. Independent
      # of each other: a package with no previews yet — a satellite's first release — fails its own
      # prune, and must not take the others' down with it.
      fail-fast: false
      matrix:
        package:
          - KoalaSoft.Aspire.Hosting.ServiceSources
          - KoalaSoft.Aspire.Hosting.ServiceSources.Java
          - KoalaSoft.Aspire.Hosting.ServiceSources.JavaScript

    steps:
      - name: Delete superseded prerelease versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: nuget
          delete-only-pre-release-versions: "true"
          # Floor: GitHub Packages holds only previews, so an unbounded prune empties it.
          min-versions-to-keep: 5
