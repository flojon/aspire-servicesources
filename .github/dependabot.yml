# Dependency updates are scoped by project role, not applied repo-wide.
#
# A version in src/ is a contract with consumers: NuGet reads a bare version as a floor, so
# it is the *oldest* release a consumer may bring. Raising it excludes people who were fine,
# and nobody gains - the satellites are built against their floor, not against latest, and
# restore hands every consumer that same floor unless something else in their graph forces
# higher. Bumping those is therefore a deliberate act (new API is actually needed, or a real
# advisory), not something a bot should do on a schedule.
#
# test/ and samples/ are the opposite: nobody consumes them, their versions constrain no one,
# and staying current is exactly what they are for.
#
# `directories` below is scoped to test/ and samples/ for that reason, but scoping alone does
# not keep Dependabot out of src/: every test project carries a ProjectReference to the
# satellite it tests, and Dependabot's NuGet updater walks that graph to resolve central
# package management versions, editing whatever Directory.Packages.props declares a package
# it decides to bump - regardless of which directory triggered the scan. Confirmed in
# practice, not just in theory: a test/-scoped run proposed CommunityToolkit.Aspire.Hosting.Java
# 13.3.0 -> 13.4.0 directly against src/Directory.Packages.props, silently undoing a floor
# that had been deliberately measured down to the version the code actually needs (#80).
# Worse, a grouped Aspire bump raised Aspire.Hosting alone and left Aspire.Hosting.JavaScript
# behind, reproducing the mismatched-pair MethodAccessException from #89 in the repo's own
# build (verified: 21 test failures against that exact combination).
#
# `ignore` below is the actual fix - it is enforced per package id rather than per directory,
# so it holds regardless of what graph Dependabot walks to get there. The trade-off, confirmed
# against GitHub's own docs rather than assumed: `ignore` suppresses Dependabot's *security*
# updates for a matching dependency too, not just version updates, so a real advisory against
# any of these five packages will not auto-generate a PR the way it does for test/ and
# samples/. Repository vulnerability alerts stay enabled regardless (Settings > Code security),
# so an advisory is still visible - it just does not turn into an automatic PR the way it
# would elsewhere, and a src/ floor bump for a CVE has to be raised and verified by hand
# regardless, the same as any other src/ floor move. Given #89, that is arguably the safer
# default anyway: an automatic bump to one half of a version-locked pair is exactly the
# failure mode that produced it.
version: 2

updates:
  - package-ecosystem: "nuget"
    # `**/*`, not `**`: Dependabot treats `*` as recursive only when a `/` follows it, so a
    # trailing `**` means one level. Either form matches today's layout - the shorter one
    # just starts silently finding nothing the day a project lands deeper. Matching is also
    # case-sensitive, so these must track the on-disk casing.
    directories:
      - "/test/**/*"
      - "/samples/**/*"
    # Belt-and-braces alongside `directories` above, not a substitute for it: this is what
    # actually keeps src/'s floors from moving, since `directories` alone does not (see the
    # header comment). Every id declared in src/Directory.Packages.props, kept in sync with
    # it by hand - there is no wildcard that means "whatever that file declares" here.
    ignore:
      - dependency-name: "Aspire.Hosting"
      - dependency-name: "Aspire.Hosting.JavaScript"
      - dependency-name: "CommunityToolkit.Aspire.Hosting.Java"
      - dependency-name: "LibGit2Sharp"
      - dependency-name: "YamlDotNet"
    schedule:
      interval: "weekly"
    # One PR per decision rather than one per package id. Ungrouped, the versions under
    # central package management fan out into a PR each, against a default cap of five open
    # at once - past which further updates are not opened at all, so the noisiest week is
    # also the one that silently drops something.
    #
    # Every group below is restricted to minor and patch. A major still arrives, but as its
    # own single-package PR: majors are where a bump stops being a version change and starts
    # being an API change, and that is worth reading on its own rather than in a diff with
    # three unrelated ids in it.
    groups:
      # xunit and its Visual Studio runner are one set - the runner implements the test
      # adapter against a specific xunit major, and a half-applied bump does not fail loudly:
      # the suite reports zero discovered tests and CI stays green.
      xunit:
        patterns:
          - "xunit"
          - "xunit.*"
        update-types:
          - "minor"
          - "patch"
      # The rest of the harness - the runner host and the coverage collector. Versioned
      # independently of xunit itself, so a separate group rather than a bigger one.
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
        update-types:
          - "minor"
          - "patch"
      # Only the sample's Aspire.Hosting.AppHost is in scope here; the published Aspire
      # floors live in src/ and are not watched. Grouped by pattern anyway so this keeps
      # holding when a sample or test app pulls in a second Aspire package.
      aspire:
        patterns:
          - "Aspire.*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Action bumps are near-uniformly a moved version tag on a pinned ref, and the workflows
    # themselves are the test: if a bump breaks one, the PR's own run says so. One PR for all
    # of them each week is therefore the reviewable unit, majors included.
    groups:
      actions:
        patterns:
          - "*"
